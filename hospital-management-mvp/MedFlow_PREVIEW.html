</style></head><body><div id="app"></div><script>const KEY='medflow-offline-demo-v1';
const seed={
  patients:[
    {id:1,firstName:'Ana',lastName:'Marinescu',birthDate:'1994-04-12',phone:'0722 000 001',email:'ana@example.test'},
    {id:2,firstName:'Mihai',lastName:'Dumitrescu',birthDate:'1982-09-05',phone:'0722 000 002',email:'mihai@example.test'},
    {id:3,firstName:'Ioana',lastName:'Georgescu',birthDate:'2001-01-21',phone:'0722 000 003',email:'ioana@example.test'},
    {id:4,firstName:'Victor',lastName:'Petrescu',birthDate:'1975-07-19',phone:'0722 000 004',email:'victor@example.test'},
    {id:5,firstName:'Alexandra',lastName:'Stan',birthDate:'1999-02-28',phone:'0722 000 005',email:'alexandra@example.test'}
  ],
  doctors:[{id:1,name:'Dr. Andrei Popescu',specialty:'Medicină internă',email:'andrei@demo.ro'},
    {id:2,name:'Dr. Maria Ionescu',specialty:'Cardiologie',email:'maria@demo.ro'},
    {id:3,name:'Dr. Elena Radu',specialty:'Medicină de familie',email:'elena@demo.ro'}],
  appointments:[],
  encounters:[{id:1,patientId:1,doctorId:1,symptoms:'Oboseală ușoară – exemplu fictiv',observations:'Date sintetice pentru demonstrație',assessment:'Exemplu de observație',createdAt:new Date().toISOString()}],
  analyses:[],audit:[]
};
function dayPlus(n,h=9,m=0){let d=new Date();d.setDate(d.getDate()+n);d.setHours(h,m,0,0);return d.toLocaleString('sv-SE').replace(' ','T').slice(0,19)}
seed.appointments=[
  {id:1,patientId:1,doctorId:1,startAt:dayPlus(1,9),reason:'Consult de rutină',status:'SCHEDULED'},
  {id:2,patientId:2,doctorId:2,startAt:dayPlus(1,10,30),reason:'Evaluare clinică',status:'SCHEDULED'},
  {id:3,patientId:3,doctorId:3,startAt:dayPlus(1,12),reason:'Control periodic',status:'SCHEDULED'},
  {id:4,patientId:4,doctorId:1,startAt:dayPlus(2,11),reason:'Consultație',status:'SCHEDULED'}
];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
let user=null, tab='dashboard', selectedPatient=null, modal=null, message='';
const creds={
  'admin@demo.ro':{role:'ADMIN',name:'Administrator Demo'},
  'doctor@demo.ro':{role:'DOCTOR',name:'Dr. Andrei Popescu',doctorId:1},
  'pacient@demo.ro':{role:'PATIENT',name:'Ana Marinescu',patientId:1}
};
const icons={dashboard:'◫',patients:'♙',appointments:'▦',encounters:'▤',ai:'✧',doctors:'⚕',audit:'▣'};
const titles={dashboard:'Prezentare generală',patients:'Pacienți',appointments:'Programări',encounters:'Consultații',ai:'Asistent AI',doctors:'Echipă medicală',audit:'Jurnal acces'};
const $=(id)=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(s){return new Date(s).toLocaleString('ro-RO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function dOnly(s){return new Date(s).toLocaleDateString('ro-RO')}
function patient(id){let p=db.patients.find(p=>p.id===+id);return p?`${p.firstName} ${p.lastName}`:'Pacient'}
function doctor(id){return db.doctors.find(d=>d.id===+id)?.name||'Medic'}
function avatar(n){return `<span class="avatar">${esc(n.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase())}</span>`}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(t){message=t;render();}
function record(action,id){db.audit.unshift({id:Date.now(),action,resource:id,createdAt:new Date().toISOString()})}
function visAppts(){return db.appointments.filter(a=>user.role==='ADMIN'||(user.role==='DOCTOR'&&a.doctorId===1)||(user.role==='PATIENT'&&a.patientId===1))}
function visPatients(){return user.role==='PATIENT'?db.patients.filter(p=>p.id===1):db.patients}
function visEncounters(){return user.role==='PATIENT'?db.encounters.filter(e=>e.patientId===1):db.encounters}
function btn(label,fn){return `<button class="btn primary-btn" onclick='${fn}'>＋ ${label}</button>`}
function header(title,sub,action=''){return `<div class="page-intro"><div class="section-heading"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div></div>`}
function empty(title){return `<div class="empty"><div class="empty-icon">✦</div><h3>${title}</h3><p>Înregistrările vor apărea aici după adăugare.</p></div>`}
function statusLabel(s){return s==='SCHEDULED'?'Programată':s==='COMPLETED'?'Finalizată':'Anulată'}
function appointmentTable(appts,actions=false){return appts.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Pacient</th><th>Medic</th><th>Data și ora</th><th>Motiv</th><th>Status</th>${actions&&user.role!=='PATIENT'?'<th>Acțiuni</th>':''}</tr></thead><tbody>${appts.map(a=>`<tr><td><div class="person-cell">${avatar(patient(a.patientId))}<span class="cell-name">${esc(patient(a.patientId))}</span></div></td><td>${esc(doctor(a.doctorId))}</td><td>${fmt(a.startAt)}</td><td>${esc(a.reason)}</td><td><span class="status status-${a.status.toLowerCase()}">${statusLabel(a.status)}</span></td>${actions&&user.role!=='PATIENT'?`<td>${a.status==='SCHEDULED'?`<button class="icon-btn" onclick="changeStatus(${a.id},'COMPLETED')">✓</button><button class="icon-btn" onclick="changeStatus(${a.id},'CANCELLED')">✕</button>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`:empty('Nicio programare')}
function dashboard(){let a=visAppts(),p=visPatients(),n=a.filter(x=>x.status==='SCHEDULED').length,c=a.filter(x=>x.status==='COMPLETED').length,x=a.filter(x=>x.status==='CANCELLED').length;
  return `<div class="welcome-row"><div><div class="eyebrow primary">● PANOU DE CONTROL</div><h1>Bun venit, ${esc(user.name.split(' ')[0])} ✳</h1><p>O privire de ansamblu asupra activității medicale din unitatea ta.</p></div>${btn('Programare nouă','openModal("appointment")')}</div>
  <div class="metric-grid">${[['Pacienți înregistrați',p.length,'♙','mint'],['Programări active',n,'▦','blue'],['Medici disponibili',db.doctors.length,'⚕','violet'],['Analize AI demo',db.analyses.length,'✧','sand']].map(([k,v,i,cl])=>`<div class="metric-card"><div class="metric-icon ${cl}">${i}</div><div class="metric-label">${k}</div><div class="metric-value">${v}</div><div class="metric-desc">Date demonstrative</div></div>`).join('')}</div>
  <div class="dashboard-grid"><section class="panel appointments-panel"><div class="section-heading" style="padding:22px"><div><h2>Programări viitoare</h2><p>Cele mai apropiate vizite medicale</p></div><button class="text-link" onclick="go('appointments')">Vezi toate →</button></div>${appointmentTable(a.filter(x=>x.status==='SCHEDULED').slice(0,5))}</section><section class="panel stats-panel"><div class="section-heading" style="padding:22px"><div><h2>Status programări</h2><p>Distribuția înregistrărilor</p></div></div><div class="donut-wrap"><div class="donut" style="background:conic-gradient(#36ad9c 0 ${n/Math.max(1,a.length)*100}%,#6b9bd7 ${n/Math.max(1,a.length)*100}% ${(n+c)/Math.max(1,a.length)*100}%,#d99d7c ${(n+c)/Math.max(1,a.length)*100}% 100%)"><div class="donut-hole"><strong>${a.length}</strong><small>Total</small></div></div></div><div class="chart-legend">${[['Programate',n,'#36ad9c'],['Finalizate',c,'#6b9bd7'],['Anulate',x,'#d99d7c']].map(([l,v,color])=>`<div><span><i style="background:${color}"></i>${l}</span><strong>${v}</strong></div>`).join('')}</div></section></div>
  <div class="dashboard-bottom"><div class="callout-ai"><div class="ai-callout-icon">✧</div><div><div class="eyebrow">FUNCȚIONALITATE DEMO</div><h3>Suport decizional demonstrativ</h3><p>Clasificator didactic. Nu este validat medical și nu produce diagnostice.</p></div>${user.role!=='PATIENT'?'<button class="btn ghost-light" onclick="go(\'ai\')">Explorează →</button>':''}</div><div class="mini-help"><span>✓</span><div><h3>Previzualizare offline</h3><p>Datele sunt salvate local în browser.</p></div></div></div>`;
}
function patients(){let p=visPatients();return header('Pacienți',`${p.length} înregistrări fictive`,user.role!=='PATIENT'?btn('Pacient nou','openModal("patient")'):'')+`<section class="panel table-panel"><div class="table-toolbar"><div class="search-box">⌕ <input placeholder="Caută pacient..." oninput="filterRows(this.value)"></div><span class="result-count">${p.length} rezultate</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Pacient</th><th>Naștere</th><th>Telefon</th><th>Email</th></tr></thead><tbody>${p.map(x=>`<tr class="clickable-row js-searchable" onclick="selectPatient(${x.id})"><td><div class="person-cell">${avatar(patient(x.id))}<span class="cell-name">${esc(patient(x.id))}<small>#${x.id}</small></span></div></td><td>${dOnly(x.birthDate)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td></tr>`).join('')}</tbody></table></div></section>`}
function appointments(){return header('Programări','Planificarea consultațiilor și gestionarea vizitelor',btn('Programare nouă','openModal("appointment")'))+`<section class="panel table-panel"><div class="table-toolbar"><div class="search-box">⌕ <input placeholder="Caută..." oninput="filterRows(this.value)"></div></div><div class="js-searchable">${appointmentTable(visAppts(),true)}</div></section>`}
function encounters(){return header('Consultații','Istoric de observații medicale fictive',user.role!=='PATIENT'?btn('Consultație nouă','openModal("encounter")'):'')+`<div class="encounter-grid">${visEncounters().map(e=>`<article class="panel encounter-card"><div class="encounter-top"><div class="person-cell">${avatar(patient(e.patientId))}<span class="cell-name">${esc(patient(e.patientId))}<small>Consultația #${e.id}</small></span></div><span class="date-chip">${fmt(e.createdAt)}</span></div><div class="encounter-body"><div class="eyebrow">SIMPTOME RAPORTATE</div><p>${esc(e.symptoms)}</p><div class="eyebrow">OBSERVAȚII</div><p>${esc(e.observations||'Nespecificate')}</p><div class="eyebrow">EVALUARE</div><p>${esc(e.assessment||'Nespecificată')}</p></div><div class="encounter-footer"><span>⚕ ${esc(doctor(e.doctorId))}</span>${user.role!=='PATIENT'?`<button class="btn outline-btn small" onclick="analyze(${e.id})">✧ Analiză AI demo</button>`:''}</div></article>`).join('')}</div>${visEncounters().length?'':empty('Nu există consultații')}`}
function ai(){return header('Asistent AI demonstrativ','Clasificator offline de exemple fictive')+`<div class="ai-warning"><span style="font-size:24px">⚠</span><div><strong>Nu este validat medical.</strong><p>Previzualizarea offline folosește doar câteva cuvinte-cheie demonstrative, nu modelul Python din aplicația full-stack. Nu este un dispozitiv medical și nu oferă diagnostice ori priorități reale de triaj.</p></div></div><div class="ai-two-col"><section class="panel ai-guide"><div class="ai-guide-icon">✧</div><h2>Flux de demonstrație</h2><p>Creează o consultație cu date fictive și rulează clasificarea textuală. În proiectul complet, modelul este oferit de serviciul FastAPI.</p><div class="ai-steps"><div><span>01</span> Deschide consultațiile</div><div><span>02</span> Adaugă un caz fictiv</div><div><span>03</span> Rulează analiza demo</div></div><button class="btn primary-btn full" onclick="go('encounters')">Mergi la consultații →</button></section><section class="panel ai-history"><div class="section-heading"><div><h2>Istoricul analizelor</h2><p>${db.analyses.length} rezultate</p></div></div>${db.analyses.map(a=>`<div class="analysis-item"><div class="analysis-top"><span class="ai-status">${esc(a.category)}</span><span class="muted small-text">${fmt(a.createdAt)}</span></div><p>${esc(a.summary)}</p><small>Nu este diagnostic. Caz fictiv, consultația #${a.encounterId}.</small></div>`).join('')||empty('Nicio analiză')}</section></div>`}
function doctors(){return header('Echipă medicală',`${db.doctors.length} medici demonstrativi`)+`<div class="doctor-grid">${db.doctors.map((d,i)=>`<article class="panel doctor-card"><div class="doctor-top">${avatar(d.name)}<span class="doctor-chip">Specialist</span></div><h3>${esc(d.name)}</h3><p>${esc(d.specialty)}</p><div class="doctor-divider"></div><div class="doctor-meta">⚕ Personal medical</div><div class="doctor-meta">✉ ${esc(d.email)}</div><button class="btn outline-btn full" onclick="openModal('appointment',${d.id})">Programare →</button></article>`).join('')}</div>`}
function audit(){return header('Jurnal de audit','Operațiuni în această previzualizare locală')+`<section class="panel table-panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>Acțiune</th><th>Resursă</th><th>Dată</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${esc(a.action)}</td><td>${esc(a.resource)}</td><td>${fmt(a.createdAt)}</td></tr>`).join('')}</tbody></table></div></section>`}
function login(){return `<main class="login-page"><div class="login-visual"><div class="brand brand-login"><span class="brand-icon">♥</span><span>medflow<span class="brand-period">.</span></span></div><div class="visual-content"><div class="eyebrow light">● PLATFORMĂ INTEGRATĂ</div><h1>Mai mult timp<br>pentru ceea ce<br><em>contează.</em></h1><p>Un spațiu pentru pacienți, programări și consultații — previzualizare offline.</p><div class="visual-features"><span>✓ Fluxuri organizate</span><span>✓ Date fictive</span><span>✓ Trei roluri</span></div></div><div class="visual-footer">PROTOTIP ACADEMIC · FĂRĂ UTILIZARE CLINICĂ</div></div><div class="login-form-area"><div class="login-card"><div class="small-graphic">♡</div><div class="eyebrow primary">BINE AI VENIT</div><h2>Autentificare în MedFlow</h2><p class="muted">Alege un cont demo. Această pagină este o simulare locală, fără autentificare securizată.</p><form class="form-stack" onsubmit="doLogin(event)"><label>Adresă email<input required id="email" type="email" value="admin@demo.ro"></label><label>Parolă<input required id="password" type="password" value="Demo1234!"></label><button class="btn primary-btn login-submit">Intră în aplicație →</button></form><div class="demo-accounts"><div class="demo-header"><span>CONTURI DEMO</span><span>parola: Demo1234!</span></div>${Object.entries(creds).map(([e,v])=>`<button class="demo-account" onclick="document.getElementById('email').value='${e}';document.getElementById('password').value='Demo1234!'"><span>${v.role==='ADMIN'?'Administrator':v.role==='DOCTOR'?'Medic':'Pacient'}<small>${e}</small></span>›</button>`).join('')}</div></div></div></main>`}
function render(){let root=$('app');if(!user){root.innerHTML=login();return;}let names=['dashboard','patients','appointments','encounters','ai','doctors','audit'].filter(x=>(x!=='ai'||user.role!=='PATIENT')&&(x!=='audit'||user.role==='ADMIN'));
  let body=({dashboard,patients,appointments,encounters,ai,doctors,audit})[tab]();
  root.innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">♥</span><span>medflow<span class="brand-period">.</span></span></div><div class="hospital-switch"><span class="hospital-glyph">✚</span><span class="hospital-words"><strong>Spitalul Demo București</strong><small>Unitate demonstrativă</small></span></div><div class="nav-caption">SPAȚIU DE LUCRU</div><nav class="nav-list">${names.map(x=>`<button class="nav-link ${tab===x?'active':''}" onclick="go('${x}')"><span style="font-size:19px;width:20px;text-align:center">${icons[x]}</span><span>${titles[x]}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-note"><span class="note-icon">⚠</span><strong>Mediu demonstrativ</strong><p>Toate datele sunt fictive și stocate local. Fără utilizare clinică.</p></div><button class="profile-side" onclick="logout()">${avatar(user.name)}<span><strong>${esc(user.name)}</strong><small>${user.role==='ADMIN'?'Administrator':user.role==='DOCTOR'?'Medic':'Pacient'}</small></span>↪</button></div></aside><div class="main-area"><header class="topbar"><div class="breadcrumbs">MedFlow › <span>${titles[tab]}</span></div><div class="topbar-right"><span class="top-date">◷ ${new Date().toLocaleDateString('ro-RO',{day:'numeric',month:'long',year:'numeric'})}</span><span class="role-pill">● ${user.role}</span>${avatar(user.name)}</div></header><main class="content">${message?`<div class="notice success">✓ ${esc(message)}<button onclick="message='';render()">×</button></div>`:''}${body}<footer class="main-footer"><span>© 2026 MedFlow · Prototip academic</span><span>● Previzualizare offline, date în browser</span></footer></main></div></div>${selectedPatient?drawer():''}${modal?modalHTML():''}`;
}
function drawer(){let p=db.patients.find(p=>p.id===selectedPatient);if(!p)return '';return `<div class="detail-overlay" onclick="selectedPatient=null;render()"><section class="detail-panel" onclick="event.stopPropagation()"><button class="icon-btn detail-close" onclick="selectedPatient=null;render()">✕</button>${avatar(patient(p.id))}<h2>${esc(patient(p.id))}</h2><p class="muted">Dosar demonstrativ #${p.id}</p><div class="detail-info"><div><span>Data nașterii</span><strong>${dOnly(p.birthDate)}</strong></div><div><span>Telefon</span><strong>${esc(p.phone)}</strong></div><div><span>Email</span><strong>${esc(p.email)}</strong></div></div><h3>Consultații</h3>${db.encounters.filter(e=>e.patientId===p.id).map(e=>`<div class="detail-encounter"><span>${fmt(e.createdAt)}</span><strong>${esc(e.symptoms)}</strong></div>`).join('')||'<p>Fără consultații.</p>'}${user.role!=='PATIENT'?`<button class="btn primary-btn full" onclick="selectedPatient=null;openModal('encounter',${p.id})">＋ Consultație nouă</button>`:''}</section></div>`}
function modalHTML(){let patientOptions=visPatients().map(p=>`<option value="${p.id}">${esc(patient(p.id))}</option>`).join('');let doctorOptions=db.doctors.filter(d=>user.role!=='DOCTOR'||d.id===1).map(d=>`<option value="${d.id}">${esc(d.name)} · ${esc(d.specialty)}</option>`).join('');let base=`<label>Pacient *<select name="patientId" required>${patientOptions}</select></label><label>Medic *<select name="doctorId" required>${doctorOptions}</select></label>`;
  let body=modal==='patient'?`<div class="form-row"><label>Prenume *<input name="firstName" required></label><label>Nume *<input name="lastName" required></label></div><label>Data nașterii *<input type="date" name="birthDate" required></label><label>Telefon<input name="phone"></label><label>Email<input type="email" name="email"></label>`:
  modal==='appointment'?base+`<label>Data și ora *<input name="startAt" type="datetime-local" value="${new Date(Date.now()+86400000).toLocaleString('sv-SE').replace(' ','T').slice(0,16)}" required></label><label>Motivul vizitei<textarea name="reason" rows="3"></textarea></label>`:
  base+`<label>Simptome fictive *<textarea name="symptoms" rows="4" required minlength="3"></textarea></label><label>Observații<textarea name="observations" rows="3"></textarea></label><label>Evaluare<textarea name="assessment" rows="3"></textarea></label>`;
  return `<div class="modal-overlay" onclick="if(event.target===this){modal=null;render()}"><div class="modal-dialog"><div class="modal-header"><div><div class="eyebrow primary">ÎNREGISTRARE</div><h2>${modal==='patient'?'Pacient nou':modal==='appointment'?'Programare nouă':'Consultație nouă'}</h2></div><button class="icon-btn" onclick="modal=null;render()">✕</button></div><form id="record-form" class="modal-form" onsubmit="saveForm(event)">${body}<div class="modal-actions"><button type="button" class="btn outline-btn" onclick="modal=null;render()">Renunță</button><button type="submit" class="btn primary-btn">Salvează ✓</button></div></form></div></div>`}
function openModal(x,selected){modal=x;render();if(selected){let el=document.querySelector(`[name=${x==='appointment'?'doctorId':'patientId'}]`);if(el)el.value=selected;}}
function go(x){tab=x;message='';selectedPatient=null;render()}
function selectPatient(id){selectedPatient=id;render()}
function filterRows(q){document.querySelectorAll('.js-searchable').forEach(x=>{x.style.display=x.innerText.toLowerCase().includes(q.toLowerCase())?'':'none'})}
function doLogin(e){e.preventDefault();let email=$('email').value,pwd=$('password').value;if(!creds[email]||pwd!=='Demo1234!'){alert('Cont demo sau parolă incorectă');return}user=creds[email];tab='dashboard';render()}
function logout(){user=null;tab='dashboard';message='';render()}
function changeStatus(id,status){let a=db.appointments.find(a=>a.id===id);if(!a||user.role==='PATIENT')return;a.status=status;record('APPOINTMENT_UPDATED','appointment:'+id);save();toast('Programarea a fost actualizată.')}
function analyze(id){let e=db.encounters.find(e=>e.id===id);if(!e)return;let t=(e.symptoms||'').toLowerCase();let category=/respira|toracic|sever|lesin|confuz/.test(t)?'ATTENTION_FLAG':/febra|tuse|durere|palpit/.test(t)?'EXTENDED_REVIEW':'GENERAL_REVIEW';db.analyses.unshift({id:Date.now(),encounterId:id,category,summary:'Rezultat fictiv: clasificare simplificată de text. Nu este diagnostic și nu trebuie folosit în îngrijire clinică.',createdAt:new Date().toISOString()});record('DEMO_AI_ANALYSIS','encounter:'+id);save();tab='ai';toast('Analiza demo a fost creată.')}
function saveForm(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let id=Date.now();if(modal==='patient'){if(user.role==='PATIENT')return;db.patients.push({...f,id});record('PATIENT_CREATED','patient:'+id)}else if(modal==='appointment'){
    let t=new Date(f.startAt);if(t.getTime()<Date.now()){alert('Alege o dată viitoare');return}if(db.appointments.some(a=>a.doctorId===+f.doctorId&&a.status==='SCHEDULED'&&Math.abs(new Date(a.startAt)-t)<30*60*1000)){alert('Medicul are o programare în acest interval de 30 minute');return}
    db.appointments.push({...f,id,patientId:+f.patientId,doctorId:+f.doctorId,status:'SCHEDULED',startAt:f.startAt});record('APPOINTMENT_CREATED','appointment:'+id)
  }else if(modal==='encounter'){if(user.role==='PATIENT')return;db.encounters.unshift({...f,id,patientId:+f.patientId,doctorId:+f.doctorId,createdAt:new Date().toISOString()});record('ENCOUNTER_CREATED','encounter:'+id)}
  save();modal=null;toast('Înregistrarea a fost salvată în acest browser.');
}
function resetDemo(){if(confirm('Ștergi modificările locale și revii la datele inițiale?')){localStorage.removeItem(KEY);location.reload()}}
render();
